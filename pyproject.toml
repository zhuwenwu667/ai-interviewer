[project]
name = "ai-interviewer"
version = "0.1.0"
description = "AI 模拟面试官：Agentic RAG + LangGraph 面试 Agent（DeepSeek + SiliconFlow + Qdrant）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web 层
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # 配置与数据校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # LLM / Embedding（DeepSeek、SiliconFlow 均为 OpenAI 兼容协议）
    "openai>=1.51.0",
    "httpx>=0.27.0",
    # Agent 编排
    "langgraph>=0.2.40",
    # 向量库（本地文件模式 / 服务器模式均可）
    "qdrant-client>=1.12.0",
    # BM25 关键词检索与中文分词
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    # 文档解析
    "pypdf>=5.0.0",
    # 前端
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
]

[project.optional-dependencies]
# 评测能力（依赖较重，按需安装：uv sync --extra eval）
eval = [
    "ragas>=0.4.3,<0.5",
    # ragas 0.4.3 仍从 langchain_community.chat_models.vertexai 导入，
    # 该模块在 community 0.4.2 被移除，固定到最后一个兼容的 0.4.x
    "langchain-community==0.4.1",
]
# Langfuse 链路追踪（不配 key 时无需安装，业务自动降级为本地 JSONL 日志）
# 固定 2.x：LangfuseSink 基于 v2 的 trace().span() API，v3 改为 OTel 接口
obs = [
    "langfuse>=2.50.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 需要真实外部服务（API key / Qdrant server）的集成测试",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# frontend 内部模块（Streamlit 直接以脚本目录为根导入）视为第一方，与 app 同级
known-first-party = ["app", "api_client", "ui_common", "views_start", "views_interview", "views_report"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# 覆盖率统计时排除的类型标注分支与显式豁免
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
