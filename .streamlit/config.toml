# 前端主题：Streamlit 从「当前工作目录下的 .streamlit/config.toml」读取本文件。
# 容器内工作目录为 /app，故镜像需一并复制该目录（见 Dockerfile）。
[theme]
# 深青绿（teal）主色：比通用 SaaS 靛蓝更沉静、辨识度更高。
# 改动配色时请同步 frontend/app.py 的 _STYLES 与 frontend/views_report.py 的图表色。
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F6"
textColor = "#1B2A2F"
font = "sans serif"

# 关闭匿名使用统计上报：容器内无外网，上报只会产生无意义的重试与日志噪声。
[browser]
gatherUsageStats = false
